// The recommendation engine is a transparent deterministic baseline, NOT an LLM.
function topicStats(history = [], questions = QUESTIONS, topics = TOPICS) {
  return topics.map(topic => {
    const qs = questions.filter(q => q.topic === topic.id);
    const records = history.filter(h => qs.some(q => q.id === h.questionId)).sort((a,b) => a.at - b.at);
    const firstAttempts = new Map();
    for (const r of records) if (!firstAttempts.has(r.questionId)) firstAttempts.set(r.questionId, r);
    const firstCorrect = [...firstAttempts.values()].filter(a => a.correct).length;
    const covered = firstAttempts.size;
    const wrong = [...firstAttempts.values()].filter(a => !a.correct).length;
    const accuracy = covered ? firstCorrect / covered : null;
    return {
      ...topic, total: qs.length, covered, attempts: records.length, firstCorrect,
      firstAccuracy: accuracy, wrong, coverage: qs.length ? covered / qs.length : 0,
      mastery: qs.length ? Math.round((firstCorrect / qs.length) * 100) : 0
    };
  });
}

function summaryStats(history = [], questions = QUESTIONS) {
  const first = new Map();
  const records = history.filter(h => questions.some(q => q.id === h.questionId));
  for (const h of [...records].sort((a,b) => a.at - b.at)) {
    if (!first.has(h.questionId)) first.set(h.questionId, h);
  }
  const firstRecords = [...first.values()];
  return {
    attempts: records.length,
    covered: firstRecords.length,
    total: questions.length,
    firstCorrect: firstRecords.filter(h => h.correct).length,
    firstAccuracy: firstRecords.length ? Math.round(100 * firstRecords.filter(h => h.correct).length / firstRecords.length) : null,
    wrongQuestions: firstRecords.filter(h => !h.correct).length
  };
}

function latestForQuestion(history, questionId) {
  // Equal millisecond timestamps still preserve the most recently appended answer.
  return history.reduce((latest, h) => h.questionId === questionId && (!latest || h.at >= latest.at) ? h : latest, null);
}

function reviewQueue(history = [], now = Date.now(), questions = QUESTIONS) {
  const records = questions.map(q => ({ question: q, latest: latestForQuestion(history, q.id) })).filter(x => x.latest);
  return records.filter(({latest}) => {
    const age = now - latest.at;
    const interval = latest.correct ? 3*86400000 : 86400000;
    return age >= interval;
  }).sort((a,b) => a.latest.at - b.latest.at);
}

function weakestTopic(history = [], questions = QUESTIONS, topics = TOPICS) {
  const stats = topicStats(history, questions, topics);
  const available = stats.filter(s => s.total > 0);
  const withUnseen = available.filter(s => s.covered < s.total);
  return [...(withUnseen.length ? withUnseen : available)].sort((a,b) => topicPriority(b, history, questions) - topicPriority(a, history, questions))[0];
}

function topicPriority(topic, history, questions) {
  const unresolved = questions.filter(q => q.topic === topic.id && latestForQuestion(history, q.id)?.correct === false).length;
  return unresolved * 4 + (1 - topic.coverage) * 2;
}

// The same decision object powers the dashboard, practice card and test assertions.
function recommendation(history = [], { topicId = null, mode = 'adaptive', now = Date.now(), questions = QUESTIONS } = {}) {
  const candidates = questions.filter(q => !topicId || q.topic === topicId);
  const due = reviewQueue(history, now, candidates);
  const wrong = candidates.filter(q => latestForQuestion(history, q.id)?.correct === false)
    .sort((a,b) => latestForQuestion(history,a.id).at - latestForQuestion(history,b.id).at);
  const decision = (question, kind, reason) => ({ question, kind, reason, topicId: question?.topic || null });
  if (mode === 'review') {
    if (due.length) return decision(due[0].question, 'due', '本题已到复习时间：最近答错间隔 1 天，答对间隔 3 天。');
    if (wrong.length) return decision(wrong[0], 'wrong', '本题最近一次作答错误，尚未到期，也可以立即巩固。');
    return decision(null, 'complete', '本轮复习完成：没有到期题或最近答错的题。');
  }
  const unseen = candidates.filter(q => !history.some(h => h.questionId === q.id));
  if (unseen.length) {
    const topic = weakestTopic(history, candidates)?.id;
    const q = unseen.filter(q => q.topic === topic).sort((a,b) => a.difficulty - b.difficulty)[0] || unseen[0];
    const stats = topicStats(history, questions).find(t => t.id === q.topic);
    const unresolved = wrong.filter(w => w.topic === q.topic).length;
    return decision(q, 'unseen', `「${stats?.label || q.topic}」已首答 ${stats?.covered || 0}/${stats?.total || 0} 题，最近仍答错 ${unresolved} 题。本题尚未作答；优先有错题且有新题的知识点，再按覆盖缺口和难度排序。`);
  }
  if (wrong.length) return decision(wrong[0], 'wrong', '所选范围内已无新题，优先复练最近仍答错且最久未练的一题。');
  if (due.length) return decision(due[0].question, 'due', '所选范围内已无新题或未纠正错题，复测一题已到期的题。');
  return decision(null, 'complete', '所选题目已覆盖，且没有待纠正或到期题。样例作答不代表已掌握知识点。');
}

function pickQuestion(history = [], options = {}) {
  return recommendation(history, options).question;
}

function suggestedAction(history = [], questions = QUESTIONS) {
  const result = recommendation(history, { questions });
  const topic = TOPICS.find(t => t.id === result.topicId);
  return { ...result, title: !result.question ? '本轮练习完成' : !history.length ? '从一道题开始诊断' : `下一题：${topic?.label || '针对性练习'}`, description: result.reason };
}

const ERROR_REASONS = { concept: '概念不清', method: '方法选错', careless: '读题或计算疏漏', unsure: '还不确定' };

function normalizeSaved(value, now = Date.now()) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return { history: [], demo: false };
  const history = (Array.isArray(value.history) ? value.history : []).flatMap(h => {
    if (!h || typeof h !== 'object') return [];
    const q = QUESTIONS.find(q => q.id === h.questionId);
    if (!q || !Number.isInteger(h.selected) || h.selected < 0 || h.selected >= q.options.length ||
        !Number.isFinite(h.at) || h.at < 0 || h.at > now + 300000) return [];
    return [{ questionId: q.id, topic: q.topic, selected: h.selected, correct: h.selected === q.answer, at: h.at,
      ...(Object.hasOwn(ERROR_REASONS, h.errorReason) ? { errorReason: h.errorReason } : {}),
      ...(['yes', 'no'].includes(h.helpful) ? { helpful: h.helpful } : {}),
      ...(h.mode === 'review' ? { mode: 'review' } : {}) }];
  }).sort((a,b) => a.at - b.at);
  return { history, demo: value.demo === true };
}

function readSaved(storage) {
  try { return { ...normalizeSaved(JSON.parse(storage.getItem(STORAGE_KEY) || '{}')), warning: '' }; }
  catch { return { history: [], demo: false, warning: '本地记录不可用或格式损坏。本次仍可练习；请检查浏览器存储设置。' }; }
}

}

async function requestAI() {
  const q=getQuestion(state.questionId);if (!q||!state.answered||state.aiLoading)return;
  if (!state.aiAvailable) {
    state.aiResponse='当前环境未启用模型讲解。静态演示使用预写解析；本地配置方法见 README。';
    render(); return;
  }
  const selected=state.selected;
  const generation=state.generation;
  state.aiLoading=true;state.aiResponse='正在请求模型讲解…';render();
  try {
    const response=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questionId:q.id,selected})});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'模型接口不可用');
    if (state.generation !== generation || state.questionId !== q.id || !state.answered) return;
    state.aiResponse=data.explanation||'模型没有返回内容';
  } catch(e) {if (state.generation === generation && state.questionId === q.id && state.answered) state.aiResponse=`AI 讲解暂不可用：${e.message}。请使用预写解析。`;}
  if (state.generation === generation && state.questionId === q.id && state.answered) {state.aiLoading=false;render();}
}

  if(action==='practice-topic'){navigate('practice',button.dataset.topic);}
  if(action==='topic'){state.topic=button.dataset.topic;state.practiceMode='adaptive';setQuestion();render();}
  if(action==='choose'&&!state.answered){state.selected=Number(button.dataset.choice);render();app.querySelector(`[data-choice="${state.selected}"]`)?.focus();}
  if(action==='submit'&&state.selected!=null&&!state.answered){const q=getQuestion(state.questionId);if(!q)return;state.attempt={questionId:q.id,topic:q.topic,correct:state.selected===q.answer,selected:state.selected,at:Date.now(),mode:state.practiceMode};state.history.push(state.attempt);state.answered=true;save();render();app.querySelector('.answer-result')?.focus();toast(state.selected===q.answer?'回答正确，已记录':'已记录错题，及时复盘更有效');}
  if(action==='next'){setQuestion();render();}
  if(action==='error-reason'&&state.attempt&&!state.attempt.correct&&Object.hasOwn(ERROR_REASONS,button.dataset.value)){state.attempt.errorReason=button.dataset.value;save();render();app.querySelector(`[data-action="error-reason"][data-value="${button.dataset.value}"]`)?.focus();}
  if(action==='helpful'&&state.attempt&&['yes','no'].includes(button.dataset.value)){state.attempt.helpful=button.dataset.value;save();render();app.querySelector(`[data-action="helpful"][data-value="${button.dataset.value}"]`)?.focus();}
  if(action==='review-q'){state.topic='all';state.view='practice';state.practiceMode='review';setQuestion({questionId:button.dataset.qid});window.location.hash='practice';render();window.scrollTo(0,0);}
  if(action==='review-start'){state.view='practice';state.topic='all';state.practiceMode='review';setQuestion({mode:'review'});window.location.hash='practice';render();window.scrollTo(0,0);}
  if(action==='ai'){requestAI();}
});
document.querySelector('#reset-button').addEventListener('click',()=>{
  if (!confirm('确定清空本设备上的作答记录吗？此操作无法撤销。')) return;
  try {localStorage.removeItem(STORAGE_KEY);state.storageWarning='';} catch {state.storageWarning='无法清除浏览器持久记录，刷新后旧数据可能恢复。请检查存储权限。';}
  state.history=[];state.demo=false;state.topic='all';state.view='dashboard';setQuestion();window.location.hash='dashboard';render();toast(state.storageWarning||'本地学习记录已重置');
});
window.addEventListener('hashchange',()=>{
  const view=window.location.hash.slice(1);
  if(['dashboard','practice','review','product'].includes(view) && view!==state.view) {
    state.view=view;
    if(view==='practice')setQuestion();
    render();
  }
});
// On a static GitHub Pages deployment, the hash route remains usable after reload.
const initial=window.location.hash.replace('#','');
if(['dashboard','practice','review','product'].includes(initial)){state.view=initial;if(initial==='practice')setQuestion();}
render();
// Probe only a loopback development service. Pages (including custom domains) and file:// stay fully static.
if (location.hostname === '127.0.0.1' && location.protocol === 'http:' && !location.pathname.endsWith('preview.html')) {
  fetch('/api/capabilities').then(r=>r.ok?r.json():{ai:false}).then(data=>{state.aiAvailable=data.ai===true;if(state.view==='practice')render();}).catch(()=>{});
}

</script>
</body>
</html>
